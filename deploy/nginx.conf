# Nginx configuration for SP-Tech Software Solution
# Place at: /etc/nginx/sites-available/sanjivani
# Enable:   sudo ln -s /etc/nginx/sites-available/sanjivani /etc/nginx/sites-enabled/
# Reload:   sudo nginx -t && sudo systemctl reload nginx

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name sanjivani.com www.sanjivani.com;
    return 301 https://$host$request_uri;
}

# HTTPS – main site
server {
    listen 443 ssl http2;
    server_name sanjivani.com www.sanjivani.com;

    # ── SSL (Let's Encrypt – run: certbot --nginx -d sanjivani.com -d www.sanjivani.com) ──
    ssl_certificate     /etc/letsencrypt/live/sanjivani.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sanjivani.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header X-XSS-Protection          "1; mode=block"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;

    # ── Static & media files (served directly by Nginx) ──
    location /static/ {
        alias /var/www/sanjivani/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /var/www/sanjivani/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Proxy to Gunicorn ──
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 90;
    }

    # ── Gzip compression ──
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # ── robots.txt & sitemap fast return ──
    location = /robots.txt  { proxy_pass http://127.0.0.1:8000; }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:8000; }

    # Logging
    access_log /var/log/nginx/sanjivani-access.log;
    error_log  /var/log/nginx/sanjivani-error.log;
}
